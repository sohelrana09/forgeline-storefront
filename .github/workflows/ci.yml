name: CI

# Typecheck, lint and unit tests on every push and pull request. No secrets needed: the unit tests cover pure logic
# only. Browser tests (npm run test:e2e) need commercetools credentials and run locally or against a deployment.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, the npm that writes package-lock.json locally: npm 10 reads optional peer
          # dependencies differently and rejects the lock file ("Missing: typescript@7 from lock file").
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
