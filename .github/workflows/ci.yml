name: CI

# Typecheck, lint and unit tests on every push and pull request. No secrets needed: the unit tests cover pure logic
# only. Browser tests (npm run test:e2e) need commercetools credentials and run locally or against a deployment.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
