name: Feature request
description: Suggest a B2B or B2C workflow, or an improvement to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this (buyer, approver, company admin, consumer, merchant, developer) and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How it should work in the storefront. If you know the commercetools API it needs, mention it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this.
