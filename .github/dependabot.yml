# Weekly dependency updates. Minor and patch versions arrive grouped in one pull request; major versions (Next.js,
# Sanity, TypeScript) come one by one, since they usually need code changes. Security updates are separate and immediate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The project runs on Node 24 (engines, .nvmrc, CI): its types follow that line.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # Planned upgrades, not weekly ones: TypeScript 7 (fails the typecheck) and ESLint 10 (waits for eslint-config-next).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
