# Weekly dependency updates. Minor and patch versions arrive grouped in one pull request; major versions (Next.js,
# Sanity, TypeScript) come one by one, since they usually need code changes. Security updates are separate and immediate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
